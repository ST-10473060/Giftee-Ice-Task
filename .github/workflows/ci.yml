name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - run: dotnet restore Giftee.slnx
      - run: dotnet build Giftee.slnx --no-restore -c Release
      - run: dotnet test Giftee.slnx --no-build -c Release

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: cp .env.example .env
      - run: docker compose build

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: csharp
          build-mode: none
      - uses: github/codeql-action/analyze@v4

  publish-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build-test, docker-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Lowercase the owner name
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Giftee.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/giftee-api:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: frontend/Giftee.Web/Dockerfile
          push: true
          tags: ghcr.io/${{ env.OWNER }}/giftee-web:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}